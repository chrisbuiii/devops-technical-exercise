# kind cluster definition for the what3words greeter exercise.
#
# Layout: one control-plane node plus two workers, so the deployment can be
# spread across workers and survive the loss of a single one.
#
# The control-plane node also carries the ingress-nginx controller: it is
# labelled ingress-ready and publishes host ports 80/443, which is how traffic
# reaches the cluster from the host. Application pods are kept off the
# control-plane by the default control-plane taint, so they only ever land on
# the two workers.
#
# Node image is pinned by digest for reproducibility. This digest is the
# v1.34.11 image published with kind v0.33.0; override it with NODE_IMAGE in
# setup.sh if you need a different Kubernetes version.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: w3w-greeter
nodes:
  - role: control-plane
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
  - role: worker
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
