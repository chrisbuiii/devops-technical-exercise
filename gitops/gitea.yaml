# A tiny in-cluster Git server so the GitOps loop is fully local: no external
# repository and no credentials to manage. Storage is an emptyDir, so the repo
# is ephemeral - fine for a demo, not for anything real (see DECISIONS.md).
apiVersion: v1
kind: Namespace
metadata:
  name: gitea
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
  labels:
    app: gitea
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      containers:
        - name: gitea
          image: gitea/gitea:1.27.3
          env:
            # SQLite keeps it to a single container; INSTALL_LOCK skips the
            # first-run web wizard so it comes up ready to use.
            - name: GITEA__database__DB_TYPE
              value: sqlite3
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__server__ROOT_URL
              value: "http://gitea.gitea.svc.cluster.local:3000/"
            - name: GITEA__server__DISABLE_SSH
              value: "true"
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "true"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: gitea
  labels:
    app: gitea
spec:
  selector:
    app: gitea
  ports:
    - name: http
      port: 3000
      targetPort: http
