# Argo CD Application that reconciles the greeter into the cluster from the
# in-cluster gitea repository. A commit to the repo changes the cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: greeter
  namespace: argocd
spec:
  project: default

  # Two sources: the chart itself, plus a reference to the same repo used only to
  # pull in the environment values file that lives outside the chart directory.
  # $values resolves to the repo root of the ref source.
  sources:
    - repoURL: http://gitea.gitea.svc.cluster.local:3000/greeter/greeter.git
      targetRevision: main
      ref: values
    - repoURL: http://gitea.gitea.svc.cluster.local:3000/greeter/greeter.git
      targetRevision: main
      path: deploy/greeter
      helm:
        valueFiles:
          - $values/gitops/values-gitops.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: greeter-gitops

  syncPolicy:
    automated:
      prune: true    # remove resources deleted from git
      selfHeal: true # revert manual drift back to git state
    syncOptions:
      - CreateNamespace=true
