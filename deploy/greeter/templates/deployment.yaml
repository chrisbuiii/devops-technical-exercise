apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "greeter.fullname" . }}
  labels:
    {{- include "greeter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "greeter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods automatically when the config changes: the checksum of
        # the rendered ConfigMap changes, which changes the pod template, which
        # triggers a rolling update. Without this, a config-only change would
        # not restart the pods and the new values would never be picked up.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "greeter.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Force replicas onto different nodes so losing one node cannot take out
      # every pod. DoNotSchedule makes this a hard requirement, which is why the
      # cluster has two workers and replicaCount defaults to 2.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          # Exclude nodes the pod cannot land on from the skew calculation.
          # Without this the tainted control-plane node counts as a zero-pod
          # domain, so 3 replicas across 2 workers (2-1) is seen as skew 2 and
          # the third pod never schedules. Honoring taints leaves only the two
          # workers as domains, where 2-1 is a valid spread.
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              {{- include "greeter.selectorLabels" . | nindent 14 }}
      containers:
        - name: greeter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          # All configuration comes from the ConfigMap as environment variables.
          envFrom:
            - configMapRef:
                name: {{ include "greeter.fullname" . }}
          # See values.yaml for the reasoning behind each probe target.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
