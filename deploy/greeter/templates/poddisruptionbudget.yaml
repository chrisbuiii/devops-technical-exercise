{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "greeter.fullname" . }}
  labels:
    {{- include "greeter.labels" . | nindent 4 }}
spec:
  # Keep at least this many pods up during voluntary disruptions (node drain,
  # rolling maintenance). With replicaCount=2 and minAvailable=1, a drain can
  # only evict one pod at a time, so the service never goes fully dark.
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "greeter.selectorLabels" . | nindent 6 }}
{{- end }}
